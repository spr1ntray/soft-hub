[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintray-soft-hub"
version = "0.6.11"
description = "Local desktop control plane for Python automation modules"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=50,<51",
  "eth-account>=0.13,<0.14",
]

[tool.setuptools.packages.find]
include = ["soft_hub*"]

[tool.setuptools.package-data]
soft_hub = ["static/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
